<!DOCTYPE html>

<html lang="en"><head>

                        "on-secondary-container": "#5e6177",
                        "ai-gradient-start": "#7952FF",
                        "surface-container-high": "#e4e8f5",
                        "tertiary": "#6134e6",
                        "background": "#f9f9ff",
                        "surface-dim": "#d5dae7",
                        "on-background": "#171c25",
                        "inverse-surface": "#2b313a",
                        "ai-gradient-end": "#FF3F6C",
                        "primary-fixed-dim": "#ffb2ba",
                        "mrp-strikethrough": "#94969F",

                        "surface-container-lowest": "#ffffff",

                        "tertiary-container": "#7a53ff",
                        "on-tertiary-container": "#fffbff",

                        "on-tertiary": "#ffffff",

                        "surface-tint": "#bd0043",
                        "on-surface": "#171c25",

                        "primary-fixed": "#ffd9dc",
                        "surface-container": "#e9eefb",
                        "on-primary-fixed-variant": "#910031",
                        "bg-off-white": "#F5F5F6",
                        "surface": "#f9f9ff",

<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: theme('colors.background');
        }
        .ai-gradient-text {
            background: linear-gradient(90deg, theme('colors.ai-gradient-start'), theme('colors.ai-gradient-end'));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .ai-blur {
            backdrop-filter: blur(12px);
            background-color: rgba(249, 249, 255, 0.85); /* surface bright with opacity */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
<!-- Top Navigation (Suppressed - This is a focused flow) -->
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-4 md:p-8">
<!-- Focused Container -->
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-lg border border-surface-variant overflow-hidden relative">
<!-- AI Decorative Header -->
<div class="h-2 w-full bg-gradient-to-r from-ai-gradient-start to-ai-gradient-end absolute top-0 left-0"></div>
<div class="p-8 md:p-12">
<!-- Close Action (Temporary departure) -->
<div class="flex justify-end mb-4">
<button class="text-secondary hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Header Content -->
<div class="text-center mb-stack-lg">
<div class="flex justify-center items-center gap-2 mb-2">
<span class="material-symbols-outlined text-ai-gradient-start text-[28px]" data-icon="auto_awesome" data-weight="fill" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface">What are you shopping for?</h1>
</div>
<p class="font-body-lg text-body-lg text-secondary">Type it in your own words, or pick a quick option below to build your wishlist.</p>
</div>
<!-- Input Area -->
<div class="mb-stack-lg relative">
<textarea class="w-full h-32 p-4 font-body-lg text-body-lg text-on-surface bg-surface-container-low border border-surface-variant rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-secondary-fixed-dim" id="wishlist-input" placeholder="e.g. I need something for my friend's wedding..."></textarea>
<!-- AI Hint / Sparkles -->
<div class="absolute bottom-4 right-4 flex items-center gap-1 text-ai-gradient-start pointer-events-none opacity-50">
<span class="font-label-bold text-label-bold uppercase">AI Match</span>
</div>
</div>
<!-- Quick Select Chips -->
<div class="mb-stack-lg">
<p class="font-label-bold text-label-bold text-secondary uppercase mb-stack-sm tracking-wider">Quick Suggestions</p>
<div class="flex flex-wrap gap-3">
<!-- Chip 1 -->
<button class="px-4 py-2 rounded-full border border-surface-variant bg-surface-container-lowest text-on-surface font-body-sm text-body-sm hover:border-primary hover:text-primary transition-all focus:outline-none">
                            Wedding
                        </button>
<!-- Chip 2 -->
<button class="px-4 py-2 rounded-full border border-surface-variant bg-surface-container-lowest text-on-surface font-body-sm text-body-sm hover:border-primary hover:text-primary transition-all focus:outline-none">
                            Vacation
                        </button>
<!-- Chip 3 -->
<button class="px-4 py-2 rounded-full border border-surface-variant bg-surface-container-lowest text-on-surface font-body-sm text-body-sm hover:border-primary hover:text-primary transition-all focus:outline-none">
                            Work
                        </button>
<!-- Chip 4 -->
<button class="px-4 py-2 rounded-full border border-surface-variant bg-surface-container-lowest text-on-surface font-body-sm text-body-sm hover:border-primary hover:text-primary transition-all focus:outline-none">
                            Birthday / Gift
                        </button>
<!-- Chip 5 -->
<button class="px-4 py-2 rounded-full border border-surface-variant bg-surface-container-lowest text-on-surface font-body-sm text-body-sm hover:border-primary hover:text-primary transition-all focus:outline-none">
                            Party
                        </button>
<!-- Chip 6 -->
<button class="px-4 py-2 rounded-full border border-surface-variant bg-surface-container-lowest text-on-surface font-body-sm text-body-sm hover:border-primary hover:text-primary transition-all focus:outline-none">
                            Something else
                        </button>
</div>
</div>
<!-- Action Area -->
<div class="mt-8 flex justify-end">
<button class="bg-surface-variant text-secondary-fixed-dim font-title-md text-title-md py-3 px-8 rounded-lg cursor-not-allowed transition-all duration-300 w-full sm:w-auto" disabled="" id="continue-btn">
                        Continue
                    </button>
</div>
</div>
</div>
</main>
<!-- Bottom Nav (Suppressed - Task-Focused page) -->
<script>
        // Simple script to handle input and button state
        const inputArea = document.getElementById('wishlist-input');
        const continueBtn = document.getElementById('continue-btn');
        const chips = document.querySelectorAll('button.rounded-full');

        function updateButtonState() {
            if (inputArea.value.trim().length > 0) {
                continueBtn.disabled = false;
                continueBtn.classList.remove('bg-surface-variant', 'text-secondary-fixed-dim', 'cursor-not-allowed');
                continueBtn.classList.add('bg-[#FF3F6C]', 'text-on-primary', 'hover:bg-primary-container', 'shadow-md');
            } else {
                continueBtn.disabled = true;
                continueBtn.classList.add('bg-surface-variant', 'text-secondary-fixed-dim', 'cursor-not-allowed');
                continueBtn.classList.remove('bg-[#FF3F6C]', 'text-on-primary', 'hover:bg-primary-container', 'shadow-md');
            }
        }

        inputArea.addEventListener('input', updateButtonState);

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                inputArea.value = chip.textContent.trim();
                updateButtonState();
                
                // Visual feedback for chip selection
                chips.forEach(c => {
                    c.classList.remove('border-primary', 'text-primary', 'bg-primary-fixed');
                    c.classList.add('border-surface-variant', 'bg-surface-container-lowest');
                });
                chip.classList.remove('border-surface-variant', 'bg-surface-container-lowest');
                chip.classList.add('border-primary', 'text-primary', 'bg-primary-fixed');
            });
        });
    </script>
</body></html>
