<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

                    "borderRadius": {

        }

<style>
        .ai-gradient-text {
            background: linear-gradient(90deg, #7952FF 0%, #FF3F6C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .ai-bg-gradient {
            background: linear-gradient(135deg, rgba(121, 82, 255, 0.05) 0%, rgba(255, 63, 108, 0.05) 100%);
        }
        .ai-glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(121, 82, 255, 0.08);
        }
    </style>
</head>
<body class="bg-bg-off-white text-on-background min-h-screen flex flex-col font-body-lg antialiased">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 md:px-10 h-16 bg-surface-container-lowest shadow-sm border-b border-surface-variant">
<div class="flex items-center gap-6">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-black text-primary">Myntra</span>
<nav class="hidden md:flex gap-6 items-center">
<a class="text-secondary font-body-lg text-body-lg hover:text-primary transition-colors" href="#">Men</a>
<a class="text-secondary font-body-lg text-body-lg hover:text-primary transition-colors" href="#">Women</a>
<a class="text-secondary font-body-lg text-body-lg hover:text-primary transition-colors" href="#">Kids</a>
<a class="text-secondary font-body-lg text-body-lg hover:text-primary transition-colors" href="#">Home &amp; Living</a>
<a class="text-secondary font-body-lg text-body-lg hover:text-primary transition-colors" href="#">Beauty</a>
</nav>
</div>
<div class="flex items-center gap-4">
<div class="hidden md:flex items-center bg-bg-off-white rounded-full px-4 py-2 border border-surface-variant focus-within:border-primary transition-colors w-64">
<span class="material-symbols-outlined text-secondary mr-2" style="font-size: 20px;">search</span>
<input class="bg-transparent border-none outline-none w-full text-body-sm font-body-sm text-on-background placeholder:text-secondary p-0 focus:ring-0" placeholder="Search for products, brands and more" type="text"/>
<span class="material-symbols-outlined text-tertiary ml-2 cursor-pointer" style="font-size: 20px;">mic</span>
</div>
<button class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-colors active:opacity-80">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-colors active:opacity-80">
<span class="material-symbols-outlined">shopping_bag</span>
</button>
</div>
</header>
<!-- Main Content Area (Background + Modal Overlay) -->
<main class="flex-grow pt-16 flex items-center justify-center relative w-full px-4 md:px-0 ai-bg-gradient overflow-hidden">
<!-- Subtle decorative background elements -->
<div class="absolute top-20 left-10 w-64 h-64 bg-tertiary rounded-full mix-blend-multiply filter blur-3xl opacity-5 animate-pulse"></div>
<div class="absolute bottom-10 right-10 w-72 h-72 bg-primary rounded-full mix-blend-multiply filter blur-3xl opacity-5 animate-pulse" style="animation-delay: 2s;"></div>
<!-- Centered Modal/Overlay -->
<div class="w-full max-w-2xl mx-auto ai-glass-panel rounded-xl p-8 md:p-12 relative z-10 my-8">
<!-- Header Section -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center bg-surface-container-low rounded-full px-3 py-1 mb-4 shadow-sm">
<span class="material-symbols-outlined text-tertiary mr-1" style="font-size: 16px;">auto_awesome</span>
<span class="font-label-bold text-label-bold ai-gradient-text uppercase tracking-widest">AI Stylist</span>
</div>
<h1 class="font-headline-lg text-headline-lg md:text-[36px] md:leading-[44px] text-on-background mb-2">Build your wishlist</h1>
<p class="font-body-lg text-body-lg text-secondary">What are you shopping for?</p>
</div>
<!-- Input Area -->
<div class="mb-8">
<div class="relative">
<textarea class="w-full bg-surface-lowest border border-surface-variant rounded-xl p-4 font-body-lg text-body-lg text-on-background placeholder:text-secondary/60 focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all resize-none shadow-inner" id="wishlist-input" placeholder="e.g. I need something for my friend's wedding..." rows="3"></textarea>
<div class="absolute bottom-4 right-4 flex gap-2">
<button aria-label="Use voice input" class="bg-surface-container hover:bg-surface-variant rounded-full p-2 transition-colors text-secondary">
<span class="material-symbols-outlined" style="font-size: 20px;">mic</span>
</button>
</div>
</div>
<p class="font-body-sm text-body-sm text-secondary mt-2 text-right">0/150 characters</p>
</div>
<!-- Suggestions Section -->
<div class="mb-10">
<h3 class="font-label-bold text-label-bold text-secondary uppercase tracking-widest mb-4">Quick Suggestions</h3>
<div class="flex flex-wrap gap-3">
<button class="suggestion-chip px-4 py-2 rounded-full border border-surface-variant bg-surface-lowest hover:border-tertiary hover:bg-surface-container-low font-body-sm text-body-sm text-on-surface-variant transition-all">
                        Wedding
                    </button>
<button class="suggestion-chip px-4 py-2 rounded-full border border-surface-variant bg-surface-lowest hover:border-tertiary hover:bg-surface-container-low font-body-sm text-body-sm text-on-surface-variant transition-all">
                        Vacation
                    </button>
<button class="suggestion-chip px-4 py-2 rounded-full border border-surface-variant bg-surface-lowest hover:border-tertiary hover:bg-surface-container-low font-body-sm text-body-sm text-on-surface-variant transition-all">
                        Work
                    </button>
<button class="suggestion-chip px-4 py-2 rounded-full border border-surface-variant bg-surface-lowest hover:border-tertiary hover:bg-surface-container-low font-body-sm text-body-sm text-on-surface-variant transition-all">
                        Birthday / Gift
                    </button>
<button class="suggestion-chip px-4 py-2 rounded-full border border-surface-variant bg-surface-lowest hover:border-tertiary hover:bg-surface-container-low font-body-sm text-body-sm text-on-surface-variant transition-all">
                        Party
                    </button>
<button class="suggestion-chip px-4 py-2 rounded-full border border-surface-variant bg-surface-lowest hover:border-tertiary hover:bg-surface-container-low font-body-sm text-body-sm text-on-surface-variant transition-all flex items-center gap-1">
                        Something else <span class="material-symbols-outlined text-[14px]">edit</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-surface-variant text-secondary font-title-md text-title-md py-4 rounded-xl flex items-center justify-center gap-2 transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed" disabled="" id="continue-btn">
<span>Continue</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center font-body-sm text-body-sm text-secondary mt-4">
                Our AI will curate personalized recommendations based on your intent.
            </p>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.getElementById('wishlist-input');
            const continueBtn = document.getElementById('continue-btn');
            const chips = document.querySelectorAll('.suggestion-chip');
            const charCount = document.querySelector('p.text-right');

            // Handle textarea input
            textarea.addEventListener('input', (e) => {
                const val = e.target.value;
                charCount.textContent = `${val.length}/150 characters`;
                
                if (val.trim().length > 0) {
                    enableButton();
                } else {
                    disableButton();
                }
            });

            // Handle chip clicks
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    const text = chip.textContent.trim();
                    if(text !== "Something else edit") {
                         textarea.value = `I'm shopping for a ${text.toLowerCase()}`;
                    } else {
                        textarea.focus();
                    }
                   
                    // Trigger input event to update state
                    textarea.dispatchEvent(new Event('input'));
                    
                    // Visual feedback on chip
                    chips.forEach(c => {
                        c.classList.remove('border-tertiary', 'bg-surface-container-low', 'text-tertiary');
                        c.classList.add('border-surface-variant', 'bg-surface-lowest', 'text-on-surface-variant');
                    });
                    chip.classList.remove('border-surface-variant', 'bg-surface-lowest', 'text-on-surface-variant');
                    chip.classList.add('border-tertiary', 'bg-surface-container-low', 'text-tertiary');
                });
            });

            function enableButton() {
                continueBtn.disabled = false;
                continueBtn.classList.remove('bg-surface-variant', 'text-secondary');
                // Use Myntra Primary color for enabled state
                continueBtn.style.background = '#FF3F6C'; 
                continueBtn.style.color = '#FFFFFF';
                // Add hover effect via JS since it's dynamic
                continueBtn.onmouseover = () => continueBtn.style.opacity = '0.9';
                continueBtn.onmouseleave = () => continueBtn.style.opacity = '1';
                continueBtn.style.boxShadow = '0 4px 14px rgba(255, 63, 108, 0.3)';
            }

            function disableButton() {
                continueBtn.disabled = true;
                continueBtn.style.background = '';
                continueBtn.style.color = '';
                continueBtn.style.boxShadow = '';
                continueBtn.classList.add('bg-surface-variant', 'text-secondary');
            }
        });
    </script>
</body></html>
