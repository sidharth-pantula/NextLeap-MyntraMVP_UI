<script>
        // Simple script to handle selection logic for visual feedback
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.option-card');
            
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Deselect all
                    cards.forEach(c => {
                        c.classList.remove('selected');
                        const check = c.querySelector('.check-icon');
                        if(check) {
                            check.classList.remove('opacity-100', 'scale-100');
                            check.classList.add('opacity-0', 'scale-50');
                        }
                    });
                    
                    // Select clicked
                    card.classList.add('selected');
                    const check = card.querySelector('.check-icon');
                    if(check) {
                        check.classList.remove('opacity-0', 'scale-50');
                        check.classList.add('opacity-100', 'scale-100');
                    }
                });
            });
        });
    </script>
