<script>
        // Simple selection logic for interactive feel
        const cards = document.querySelectorAll('.ai-card-hover');
        cards.forEach(card => {
            card.addEventListener('click', function() {
                // Remove active class from all
                cards.forEach(c => {
                    c.classList.remove('ai-card-active');
                    const icon = c.querySelector('.material-symbols-outlined');
                    if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                
                // Add active class to clicked
                this.classList.add('ai-card-active');
                const icon = this.querySelector('.material-symbols-outlined');
                if(icon) icon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
